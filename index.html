<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>たべものマスター</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFF7E8; --ink:#24324A; --sub:#647089; --navy:#1F3A5F; --card:#fff; --line:#EADFC8;
  --accent:#2BA84A; --accent2:#F08A24; --ok:#1F9D63; --ng:#E0484B;
  --red:#E8504A; --yel:#F2B200; --grn:#3DAA5C;
  --haru:#E86A9A; --natsu:#1E9BC9; --aki:#D9772B; --fuyu:#6C7FD1;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'M PLUS Rounded 1c',system-ui,-apple-system,'Hiragino Maru Gothic ProN',sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100vh}
button{font-family:inherit}
ruby rt{font-weight:700;color:var(--sub);font-size:.5em}
.hidden{display:none!important}

/* header */
.topbar{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;display:flex;align-items:center;gap:8px;padding:8px 12px}
.topbar::after{content:'';position:absolute;left:0;right:0;bottom:-5px;height:5px;background:linear-gradient(90deg,var(--red) 0 33.3%,var(--yel) 33.3% 66.6%,var(--grn) 66.6%)}
.logo{display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;font-weight:800;font-size:17px;cursor:pointer;padding:2px 4px}
.logo .mk{width:28px;height:28px;border-radius:50%;background:conic-gradient(var(--red) 0 120deg,var(--yel) 120deg 240deg,var(--grn) 240deg);position:relative}
.logo .mk::after{content:'';position:absolute;inset:6px;border-radius:50%;background:#fff}
.spacer{flex:1}
.tbtn{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:999px;padding:6px 14px;min-height:44px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.tbtn{display:inline-flex;align-items:center;gap:4px;position:relative;flex:none}
.tbtn .ti{width:18px;height:18px;flex:none}
.tbtn .st{display:none;position:absolute;right:-4px;top:-5px;background:var(--ng);color:#fff;border-radius:6px;padding:0 5px;font-size:10.5px;font-weight:800;line-height:1.5;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.tbtn[aria-pressed="false"]{background:transparent;border-style:dashed;color:#AEB9C9}
.tbtn[aria-pressed="false"] .st{display:inline-block}
.tbtn .ti .on{display:inline}.tbtn .ti .off{display:none}
.tbtn[aria-pressed="false"] .ti .on{display:none}.tbtn[aria-pressed="false"] .ti .off{display:inline}
.logo{white-space:nowrap;min-width:0}.logo .mk{flex:none}
@media (max-width:380px){.logo{font-size:14.5px;gap:6px}.tbtn{padding:6px 9px}.tbtn .ti{display:none}.topbar{gap:6px;padding:8px 8px}}
main{max-width:820px;margin:0 auto;padding:22px 14px 48px}
.screen{display:none}
.screen.on{display:block;animation:fadein .25s ease-out}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
h2{font-size:22px;margin:4px 0 14px}
h3{font-size:16px;margin:22px 0 10px;color:var(--sub)}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:16px;padding:15px 18px;font-weight:800;font-size:18px;cursor:pointer;color:var(--ink);background:#fff;box-shadow:0 4px 0 var(--line),0 8px 16px rgba(36,50,74,.06);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 4px 0 #1d7f36,0 8px 16px rgba(43,168,74,.18)}
.btn.orange{background:var(--accent2);color:#fff;box-shadow:0 4px 0 #b9600f,0 8px 16px rgba(240,138,36,.18)}
.btn.navy{background:var(--navy);color:#fff;box-shadow:0 4px 0 #0f2238}
.btn.ghost{background:transparent;box-shadow:none;border:2px solid var(--line);font-size:15px;padding:11px}
.btn:disabled{opacity:.45;cursor:default}
.btn .ic{width:30px;height:30px;flex:none}
.row{display:flex;gap:10px}
.row>*{flex:1}
.linkbtn{background:none;border:0;color:var(--sub);font-weight:700;font-size:13px;text-decoration:underline;cursor:pointer;display:block;margin:14px auto 0}

/* title */
.hero{background:#fff;border-radius:24px;padding:18px 18px 22px;box-shadow:0 10px 30px rgba(36,50,74,.08);text-align:center;position:relative;overflow:hidden}
.hero svg{width:100%;max-width:340px;height:auto;display:block;margin:0 auto}
.hero .sub{margin:6px 0 0;color:var(--sub);font-weight:700;font-size:14px}
.hero h1{margin:4px 0 0;font-size:clamp(30px,8vw,44px);font-weight:800;letter-spacing:.02em;line-height:1.15}
.hero h1 small{display:inline-block;margin-left:8px;font-size:.42em;background:var(--accent2);color:#fff;border-radius:8px;padding:3px 8px;vertical-align:middle}
.hero .bob{animation:bob 2.4s ease-in-out infinite}
.hero .bob.d1{animation-delay:.4s}.hero .bob.d2{animation-delay:.8s}
@keyframes bob{50%{transform:translateY(-4px)}}
.menu{display:grid;gap:12px;margin-top:18px}
.stat{text-align:center;color:var(--sub);font-size:13px;margin-top:16px}
.cnt{background:var(--ng);color:#fff;border-radius:999px;font-size:13px;padding:1px 8px;margin-left:4px}

/* course */
.seg{display:flex;background:#fff;border-radius:14px;padding:4px;gap:4px;box-shadow:0 2px 0 var(--line)}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:10px 4px;font-weight:800;font-size:15px;color:var(--sub);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.seg-note{font-size:12.5px;color:var(--sub);margin:8px 2px 0;min-height:1.4em;line-height:1.6}
.course-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.course{position:relative;text-align:left;border:0;border-radius:18px;background:#fff;padding:16px 16px 14px 22px;cursor:pointer;box-shadow:0 4px 0 var(--line),0 8px 16px rgba(36,50,74,.05);overflow:hidden;transition:transform .08s;color:var(--ink);font-family:inherit}
.course:active{transform:translateY(3px)}
.course::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--stripe)}
.course .t{font-size:19px;font-weight:800;display:block}
.course .d{font-size:12.5px;color:var(--sub);display:block;margin-top:4px;line-height:1.6}
.course .best{position:absolute;right:12px;top:12px;font-size:12px;font-weight:800;color:var(--accent2)}

/* quiz */
.qhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.qno{font-weight:800;font-size:15px;white-space:nowrap}
.pbar{flex:1;height:10px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),#80C241);border-radius:99px;transition:width .3s}
.pbar.time i{background:linear-gradient(90deg,var(--accent2),#F5B301);transition:none}
.qscore{font-weight:800;color:var(--ok);white-space:nowrap}
.qcard{background:#fff;border-radius:20px;padding:14px 16px 16px;box-shadow:0 8px 20px rgba(36,50,74,.07);text-align:center;position:relative}
.qtag{position:absolute;left:14px;top:12px;font-size:12px;font-weight:800;color:#fff;background:var(--navy);border-radius:8px;padding:3px 9px}
.qtimer{height:6px;border-radius:9px;background:var(--line);overflow:hidden;margin:2px 0 6px}
.qtimer i{display:block;height:100%;background:var(--accent2);width:100%}
.qfood{width:min(46vw,190px);height:min(46vw,190px);margin:14px auto 0;display:block}
.qfood.pop{animation:pop .3s ease-out}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:none;opacity:1}}
.qname{font-size:clamp(24px,7vw,32px);font-weight:800;margin-top:4px;line-height:1.5}
.qtext{font-size:clamp(16px,4.4vw,19px);font-weight:800;color:var(--sub);margin-top:2px;line-height:1.8}
.plates{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.plate{border:0;background:none;cursor:pointer;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);font-family:inherit;transition:transform .08s}
.plate:active{transform:translateY(3px)}
.plate .dish{width:min(26vw,118px);height:min(26vw,118px);border-radius:50%;background:radial-gradient(circle,#fff 0 52%,#F4F1EA 53% 58%,#fff 59%);border:9px solid var(--c);box-shadow:0 5px 0 rgba(36,50,74,.16),0 10px 18px rgba(36,50,74,.08);display:grid;place-items:center;font-weight:800;font-size:clamp(22px,6vw,30px);color:var(--c);position:relative}
.plate .lab{font-size:clamp(11.5px,3.2vw,13.5px);font-weight:800;line-height:1.5;text-align:center}
.plate .lab rt{font-size:.6em}
.plate.ok .dish{background:var(--c);color:#fff;transform:scale(1.06)}
.plate.ok .dish rt{color:#fff}
.plate.ok .dish::after{content:'⭕';position:absolute;right:-8px;top:-10px;font-size:22px}
.plate.ng .dish{opacity:1;filter:grayscale(.5)}
.plate.ng .dish::after{content:'✖';position:absolute;right:-6px;top:-10px;font-size:22px;color:var(--ng)}
.plate.dim{opacity:.4}
.ktray{padding-top:40px}
.fcell.nogot svg,.evrow.nogot svg{filter:grayscale(1) brightness(1.15);opacity:.35}
.fcell.nogot span{color:#A9A29A}
.zprog{background:#fff;border-radius:16px;padding:10px 14px;box-shadow:0 2px 0 var(--line);margin-bottom:12px}
.zp-t{font-weight:800;font-size:15px;margin-bottom:6px}
.zp-t b{font-size:20px;color:var(--accent2)}
.zp-t rt,.zp-n rt{font-size:.55em}
.zp-n{font-size:12px;color:var(--sub);margin-top:6px;font-weight:700}
.newgot{margin-top:8px;font-weight:800;color:var(--accent2);font-size:15px}
.newgot rt{font-size:.55em}
#z-tabs{display:grid;grid-template-columns:repeat(3,1fr)}
.evcard{margin:30px auto 6px;display:flex;flex-direction:column;align-items:center;gap:4px;background:#FFF1EC;border:3px solid #E8B4A6;border-radius:20px;padding:18px 16px;max-width:300px}
.evcard .evd{font-weight:800;color:#B8432E;font-size:16px}
.evcard .evn{font-weight:800;font-size:clamp(24px,7vw,32px);line-height:1.5}
.evcard rt{font-size:.5em}
.sscard svg{width:56px;height:56px}
.sscard .evd{color:var(--c)}
.seasons.evopts{grid-template-columns:1fr}
.seasons.evopts .sbtn{min-height:62px;font-size:clamp(17px,4.6vw,20px)}
.evb{display:flex;flex-direction:column;align-items:center;line-height:1.4}
.evb small{font-size:12px;opacity:.85}
.evb>span{display:block;text-align:center}
.qtext,.kodai{text-wrap:balance}
.evline{display:grid;gap:8px}
.evrow{display:flex;align-items:center;gap:10px;border:0;background:#fff;border-radius:16px;padding:6px 12px;box-shadow:0 2px 0 var(--line);cursor:pointer;font-family:inherit;color:var(--ink);text-align:left;min-height:60px}
.evrow.sel{background:#FFE9CF}
.evrow svg{width:50px;height:50px;flex:none}
.evm{font-weight:800;font-size:22px;color:#B8432E;width:52px;text-align:center}
.evm small{font-size:12px}
.evt{display:flex;flex-direction:column;line-height:1.5}
.evt b rt,.evt span rt{font-size:.55em}
.cal .evk{cursor:pointer}
.kodai{font-weight:800;font-size:clamp(16px,4.4vw,19px);line-height:1.8}
.kodai rt,.kslot rt,.km rt,.kcard rt,.ktray rt{font-size:.55em}
.kslots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kslot{background:var(--bg);border:2px dashed var(--line);border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;min-height:118px}
.kslot.on{border-style:solid;background:#fff}
.kslot svg{width:64px;height:64px}
.kslot .qm{font-size:34px;font-weight:800;color:#CFC4AE;height:64px;display:grid;place-items:center}
.kslot .kc{font-size:12px;color:var(--sub);font-weight:800}
.kslot .kn{font-size:12.5px;font-weight:800;line-height:1.35}
.kmeter{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:12px}
.km{width:54px;height:54px;border-radius:50%;border:5px solid var(--c);display:grid;place-items:center;font-weight:800;font-size:20px;color:var(--c);opacity:.35;background:#fff}
.km.on{opacity:1;background:var(--c);color:#fff}
.km.on rt{color:#fff}
.kh{width:100%;font-size:12px;color:var(--sub);font-weight:700}
.kgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.kcard{border:2px solid transparent;background:#fff;border-radius:16px;padding:6px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;color:var(--ink);box-shadow:0 2px 0 var(--line);min-height:44px}
.kcard svg{width:58px;height:58px}
.kcard span{font-size:12.5px;font-weight:800;line-height:1.35;text-align:center}
.kcard.sel{border-color:var(--accent2);background:#FFF1DE}
.kcard.ok{border-color:var(--ok);background:#E6F6EE}
.kcard.ok:disabled,.kcard.ng:disabled{opacity:1}
.kodai br{display:block}
.kcard.ng{border-color:var(--ng);background:#FDE8E8}
.kcard small{font-size:11px;color:var(--sub);font-weight:800}
.kcard small rt{font-size:.55em}
.ksty{display:block;width:fit-content;margin:0 auto 2px;font-size:12px;font-weight:800;color:#fff;background:var(--accent2);border-radius:999px;padding:0 10px;margin-bottom:4px;line-height:1.9}
.ksty rt{font-size:.55em;color:#fff}
.kstep{font-size:13px;color:var(--accent2);font-weight:800;margin-top:2px}
.kstep rt{font-size:.55em}
.kslot.tap{cursor:pointer}
.kslot.rm{opacity:.45;border-color:var(--ng);border-style:solid;position:relative}
.kslot.rm::after{content:'×';position:absolute;top:2px;right:8px;color:var(--ng);font-weight:800;font-size:22px}
.kslot.ans{border-color:var(--ok);border-style:solid;background:#E6F6EE}
.kwhy{margin-top:6px;display:flex;flex-direction:column;gap:3px;font-size:14px}
.kwhy rt{font-size:.55em}
.kslots{grid-template-columns:repeat(4,1fr)!important;gap:6px!important}
.kslot svg{width:54px!important;height:54px!important}
.kslot.ans{border-color:var(--ok);background:#E6F6EE}
.klegend{display:grid;grid-template-columns:1fr 1fr;gap:4px 10px;background:#fff;border-radius:14px;padding:8px 12px;margin-top:12px;box-shadow:0 2px 0 var(--line);font-size:12.5px;color:var(--sub);font-weight:700}
.klegend b{color:var(--ink);margin-right:6px}
.klegend rt{font-size:.55em}
.kcard:disabled{cursor:default;opacity:.45}
.kcard.sel:disabled{opacity:1}
.plate.tog .dish{opacity:.55;filter:grayscale(.3)}
.plate.tog.on .dish{opacity:1;filter:none;background:var(--c);color:#fff;transform:scale(1.04)}
.plate.tog.on .dish rt{color:#fff}
.plate.miss .dish{border-style:dashed;opacity:1}
.plate.miss .dish::after{content:'！';position:absolute;right:-4px;top:-10px;font-size:22px;color:var(--accent2);font-weight:800}
.qing{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:6px}
.qing .ingh{width:100%;font-size:12.5px;color:var(--sub);font-weight:800}
.ingc{display:inline-flex;align-items:center;gap:3px;background:var(--bg);border-radius:999px;padding:2px 10px 2px 4px;font-weight:800;font-size:14px}
.ingc svg{width:26px;height:26px}
.ingc rt{font-size:.55em}
.inglist{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 2px}
.ingc.sm{font-size:13.5px}
.plate:disabled{cursor:default}
.plate .dish svg{width:70%;height:70%}
.seasons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.sbtn{min-height:70px;border:0;border-radius:16px;background:#fff;box-shadow:0 4px 0 var(--line),0 6px 12px rgba(36,50,74,.05);font-weight:800;font-size:clamp(20px,5.4vw,24px);color:var(--c);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;border-left:10px solid var(--c);font-family:inherit}
.sbtn:active{transform:translateY(3px)}
.sbtn rt{font-size:.5em}
.sbtn svg{width:34px;height:34px;flex:none}
.seasons.opts .sbtn{font-size:clamp(17px,4.6vw,21px);justify-content:flex-start;padding:0 12px;gap:8px}
.seasons.opts .sbtn svg{width:40px;height:40px}
.seasons.parts .sbtn:last-child{grid-column:1 / -1;justify-content:center}
.seasons.opts .sbtn svg{background:#fff;border-radius:10px;padding:2px}
.zgrp h4{display:flex;align-items:center;justify-content:center;gap:6px;font-size:15px;color:var(--ink)}
.zgrp h4 rt{font-size:.55em}
.zh-ic svg{width:34px;height:34px;display:block}
.zgrp{margin-top:10px}
.sbtn.ok{background:var(--c);color:#fff}
.sbtn.ok rt{color:#fff}
.sbtn.ok svg.si *,.sbtn.ng svg.si *{fill:#fff;stroke:#fff}
.sbtn.ng{background:var(--ng);color:#fff;border-left-color:var(--ng)}
.sbtn.ng rt{color:#ffe3e3}
.sbtn.dim{opacity:.4}
.sbtn:disabled{cursor:default}
.feedback{margin-top:16px;background:#fff;border-radius:20px;padding:16px;box-shadow:0 8px 20px rgba(36,50,74,.08);border-top:7px solid var(--ok)}
.feedback.ng{border-top-color:var(--ng)}
.fb-res{font-size:24px;font-weight:800;color:var(--ok)}
.feedback.ng .fb-res{color:var(--ng)}
.fb-exp{margin-top:8px;line-height:1.9;font-size:16px}
.fb-exp rt{font-size:.55em}
.fb-exp .note{margin-top:6px;background:#FFF7E8;border-radius:12px;padding:8px 12px;font-size:15px}
.feedback .btn{margin-top:14px}
.gb{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 12px;font-weight:800;color:#fff;background:var(--c);white-space:nowrap;font-size:.95em;vertical-align:middle;line-height:1.7}
.gb rt{color:#fff;opacity:.9}
.gb.out{background:#fff;color:var(--sub);border:2px dashed var(--line);font-size:.85em}
.flash{position:fixed;left:50%;top:44%;transform:translate(-50%,-50%);font-size:84px;pointer-events:none;z-index:60;animation:flash .5s ease-out forwards}
@keyframes flash{0%{opacity:0;transform:translate(-50%,-40%) scale(.6)}30%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.tabig{font-size:15px;font-weight:800;color:var(--sub);text-align:center;margin-top:10px}

/* result */
.rcard{background:#fff;border-radius:24px;padding:24px 18px;text-align:center;box-shadow:0 10px 30px rgba(36,50,74,.08)}
.stars{font-size:40px;letter-spacing:6px;color:#F5B301}
.rscore{font-size:46px;font-weight:800;margin-top:4px}
.rscore small{font-size:20px;color:var(--sub)}
.rmsg{font-weight:800;font-size:18px;margin-top:6px}
.rbest{color:var(--accent2);font-weight:800;font-size:14px;margin-top:6px;min-height:1.2em}
.slist{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.slist li{background:#fff;border-radius:14px;padding:8px 12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;box-shadow:0 2px 0 var(--line)}
.slist li svg.fi{width:42px;height:42px;flex:none}
.slist .nm{font-weight:800;font-size:18px;margin-right:2px}
.slist .times{margin-left:auto;font-weight:800;color:var(--ng);font-size:14px}
.empty{color:var(--sub);text-align:center;padding:18px;background:#fff;border-radius:14px}

/* zukan */
.tabs{margin-bottom:14px}
.gcols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gcol{background:#fff;border-radius:18px;padding:10px 6px 8px;box-shadow:0 2px 0 var(--line);border-top:8px solid var(--c)}
.gcol h4{margin:0 0 2px;text-align:center;color:var(--c);font-size:17px}
.gcol .gd{font-size:11px;color:var(--sub);text-align:center;line-height:1.5;min-height:3em;font-weight:700}
.gcol .gd rt{font-size:.6em}
.fgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:2px}
.fcell{border:0;background:none;padding:4px 2px;width:64px;cursor:pointer;display:flex;flex-direction:column;align-items:center;font-family:inherit;color:var(--ink);border-radius:12px}
.fcell:hover{background:var(--bg)}
.fcell svg{width:44px;height:44px}
.fcell span{font-size:11px;font-weight:700;line-height:1.3;text-align:center;word-break:keep-all;overflow-wrap:anywhere;max-width:100%}
.zgrp .fcell{width:72px}
.fcell span rt{font-size:.6em}
.fcell.sel{background:#FFE9CF}
.outbox{margin-top:10px;background:#fff;border-radius:18px;padding:10px;box-shadow:0 2px 0 var(--line)}
.outbox h4{margin:2px 0 6px;font-size:13.5px;color:var(--sub);text-align:center}
.calwrap{background:#fff;border-radius:22px;padding:8px;box-shadow:0 4px 0 var(--line)}
.cal{width:100%;max-width:460px;display:block;margin:0 auto;touch-action:manipulation}
.cal .sw{cursor:pointer}
.cal .fd{pointer-events:none}
.cal .fd circle.bg{fill:#fff;stroke:#E4DCCB;stroke-width:1.5}
.spanel{margin-top:12px;background:#fff;border-radius:18px;padding:10px 8px;box-shadow:0 2px 0 var(--line);border-top:8px solid var(--c)}
.spanel h4{margin:2px 0 8px;text-align:center;font-size:17px;color:var(--c)}
.spanel h4 rt{font-size:.55em}
.spanel .fcell{width:72px}
.spanel .fcell svg{width:52px;height:52px}
.spanel .fcell span{font-size:12px}
.zinfo{position:relative;margin-top:12px;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 6px 18px rgba(36,50,74,.1);border-left:7px solid var(--accent2);display:flex;gap:12px;align-items:flex-start}
.zinfo svg.fi{width:84px;height:84px;flex:none}
.zinfo .x{position:absolute;right:2px;top:2px;width:44px;height:44px;border:0;background:none;font-size:24px;cursor:pointer;color:var(--sub);border-radius:12px}
.zinfo .nm{font-size:22px;font-weight:800}
.zinfo .tg{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.zinfo .ex{font-size:14.5px;line-height:1.85}
.zinfo .ex rt{font-size:.55em}
.credit{font-size:11.5px;color:var(--sub);margin-top:24px;line-height:1.7}
.credit a{color:var(--sub)}

/* sample */
.smp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.smpcol{background:#fff;border-radius:18px;padding:10px;box-shadow:0 2px 0 var(--line);text-align:center}
.smpcol h4{margin:2px 0 2px;font-size:16px}
.smpcol p{margin:0 0 6px;font-size:11.5px;color:var(--sub);line-height:1.5;min-height:3em}
.smpcol .gr{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.smpcol svg{width:100%;height:auto}

.modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:grid;place-items:center;z-index:50;padding:16px}
.modal .box{background:#fff;border-radius:20px;padding:20px;max-width:360px;width:100%;text-align:center;font-weight:700}
.modal .row{margin-top:16px}
@media (max-width:420px){
  main{padding:16px 10px 40px}
  .plates{gap:6px}
  .gcol{padding:10px 3px 8px}
  .fcell{width:50px;padding:3px 0}
  .fcell svg{width:36px;height:36px}
  .fcell span{font-size:10px}
}
</style>
</head>

<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rnd = n => Math.floor(Math.random() * n);
const sample = a => a[rnd(a.length)];
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };

const CKEYS = ['r', 'y', 'g'];

DISHES.forEach(d => { d.kind = 'dish'; d.d = colorsOf(d.ing); F[d.id] = d; });

EVENTS.forEach(e => { e.kind = 'event'; e.e = e.ev; F[e.id] = e; });
// 献立の分け方：主食・主菜・副菜は食事バランスガイドの区分、料理ごとの分類は農林水産省の料理イラスト集に合わせ、汁物を4つ目の枠にした

  fuku: { n: '{副菜|ふくさい}', d: 'やさい・いも・きのこのおかず' },

const KKEYS = Object.keys(KC);
const KZ = { ...KC, one: { n: 'これ1つで{主食|しゅしょく}とおかずになる{料理|りょうり}' }, both: { n: '{主菜|しゅさい}にも{副菜|ふくさい}にもなる{料理|りょうり}' } };

  y: { c: 'var(--yel)', hex: '#F2B200', n: '{黄|き}', sh: 'エネルギーになる', d: 'おもにエネルギーのもとになる', ex: 'ごはん・パン・めん・いも・{油|あぶら}・さとうなど' },
  g: { c: 'var(--grn)', hex: '#3DAA5C', n: '{緑|みどり}', sh: '{調子|ちょうし}をととのえる', d: 'おもに{体|からだ}の{調子|ちょうし}をととのえるもとになる', ex: 'やさい・くだもの・きのこなど' },
};

/* ---------- storage ---------- */
const store = {

store.load();
function weakItems() {
  return Object.entries(store.d.weak).map(([k, v]) => { const [m, id] = k.split(':'); return { k, m, id, n: v }; })

/* ---------- sound ---------- */
let actx = null;
// スマホのブラウザやアプリ内の表示では、音の仕組みが止まった状態で始まることがある。
// 最初のタップで作って動かし、無音を一度鳴らしておく（iPhone 向け）。止まっていたら鳴らす前に動かし直す。
function audioCtx() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null;
    actx = new AC();
    try { const b = actx.createBuffer(1, 1, 22050), src = actx.createBufferSource(); src.buffer = b; src.connect(actx.destination); src.start(0); } catch (e) { }
  }
  if (actx.state !== 'running') { try { actx.resume(); } catch (e) { } }
  return actx;
}
['pointerdown', 'touchend', 'keydown'].forEach(ev => document.addEventListener(ev, () => { if (store.d.sound) audioCtx(); }, { capture: true, passive: true }));
function playNotes(kind) {
  const t = actx.currentTime + .01;
  const notes = kind === 'ok' ? [[784, 0], [1047, .1]] : kind === 'ng' ? [[262, 0], [196, .13]] : kind === 'fan' ? [[523, 0], [659, .12], [784, .24], [1047, .36]] : [[880, 0]];
  notes.forEach(([f, dt]) => {
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = kind === 'ng' ? 'square' : 'triangle'; o.frequency.value = f;
    const peak = kind === 'ng' ? .06 : kind === 'tap' ? .05 : .16;   // シリーズのほかの作品と同じ大きさ
    g.gain.setValueAtTime(.0001, t + dt); g.gain.exponentialRampToValueAtTime(peak, t + dt + .02);
    g.gain.exponentialRampToValueAtTime(.0001, t + dt + .24);
    o.connect(g).connect(actx.destination); o.start(t + dt); o.stop(t + dt + .26);
  });
}
function beep(kind) {
  if (!store.d.sound) return;
  try {
    const c = audioCtx(); if (!c) return;
    if (c.state === 'running') playNotes(kind);
    else c.resume().then(() => playNotes(kind)).catch(() => { });
  } catch (e) { }
}

/* ---------- question pool ---------- */
function pool(mode, D) {
  if (mode === 'd') return D === 'easy' ? DISHES.filter(d => d.ing.length <= 3) : DISHES;
  if (mode === 'k') return DISHES;
  if (mode === 'e') return EVENTS;
  const all = FOODS.filter(f => f[mode]);
  if (D !== 'easy') return all;
  return mode === 's' ? all.filter(f => f.e) : all.filter(f => !f[MODES[mode].tr]);
}
function weightOf(f, mode, D) { const t = MODES[mode].tr; return D === 'hard' && t && f[t] ? 3 : 1; }
// 出た問題を覚えておき（seen）、しばらく出ていないものから先に出す。回をまたいでも同じ問題がすぐには出ない
function seenKey(x) { return x.m + ':' + (x.key || x.f.id); }
function wpickFood(list, wfn, avoid, useSeen) {
  let cands = list.filter(x => !avoid.has(x.key || x.f.id));
  if (!cands.length) cands = list;
  if (useSeen && cands.length > 1) {
    const sn = store.d.seen || {};
    cands = [...cands].sort((a, b) => (sn[seenKey(a)] || 0) - (sn[seenKey(b)] || 0) || Math.random() - .5);
    cands = cands.slice(0, Math.max(6, Math.ceil(cands.length * .3)));
  }
  const tot = cands.reduce((a, x) => a + wfn(x), 0); let r = Math.random() * tot;
  for (const x of cands) { r -= wfn(x); if (r <= 0) return x; }
  return cands[cands.length - 1];
}

/* ---------- quiz flow ---------- */
let Q = null, tickId = null, nextId = null;
function stopTimers() { if (tickId) { clearInterval(tickId); tickId = null; } if (nextId) { clearTimeout(nextId); nextId = null; } }
function startQuiz(C, items) {
  stopTimers();
  const D = store.d.diff;
  // items: [{m, f, w}]
  // もと・どこを食べてる？は、答え（大豆・牛乳… / 根・茎…）ごとに出やすさをそろえる（大豆製品が多くても大豆ばかりにならないように）
  const P = items ? null : pool(C.mode, D), cnt = {};
  // 答えごとの重みの合計を√にそろえる：品数の多い答え（大豆など）も出すぎず、品数の少ない答え（花・つぼみなど）が同じ品ばかりにもならない
  if (P && (C.mode === 'm' || C.mode === 'p' || C.mode === 'd')) P.forEach(f => cnt[f[C.mode]] = (cnt[f[C.mode]] || 0) + weightOf(f, C.mode, D));
  const dirs = D === 'easy' ? ['f'] : ['f', 'r'];
  const list = items || (C.mode === 'e' ? EVENTS.flatMap(e => dirs.map(dir => ({ m: 'e', f: e, key: e.id + ':' + dir, dir, w: 1 }))) : null) ||
    (C.mode === 's' ? P.flatMap(f => ['f', 'r'].map(dir => ({ m: 's', f, key: f.id + ':' + dir, dir, w: 1 }))) : null) || P.map(f => ({ m: C.mode, f, key: f.id, w: weightOf(f, C.mode, D) / (cnt[f[C.mode]] ? Math.sqrt(cnt[f[C.mode]]) : 1) }));
  Q = { C, D, list, i: 0, score: 0, wrong: [], used: new Set(), recent: [], cur: null };
  const nq = C.key === 'weak' ? Math.min(NQ, list.length) : NQ;
  Q.nq = () => nq;   // 問題数（にがては最大10）
  show('quiz');
  $('#q-pbar').classList.toggle('time', !!C.ta);

}
function taTick() {

}
function nextQuestion() {
  if (!Q.C.ta && Q.i >= Q.nq()) return finish();

  const it = wpickFood(Q.list, x => x.w || 1, avoid, Q.C.key !== 'weak');
  Q.used.add(it.key || it.f.id);
  store.d.seen = store.d.seen || {}; store.d.seenTick = (store.d.seenTick || 0) + 1; store.d.seen[seenKey(it)] = store.d.seenTick; store.save();
  Q.recent.push(it.key || it.f.id); if (Q.recent.length > Math.min(8, Q.list.length - 1)) Q.recent.shift();
  Q.cur = { m: it.m, f: it.f, answered: false, chosen: null, ok: null };
  if (Q.cur.m === 'e' || Q.cur.m === 's') Q.cur.dir = it.dir || 'f';   // f：行事→たべもの、r：たべもの→行事
  Q.cur.opts = optsOf(Q.cur);

    }, 80);

}
// 選択肢：もとは正解＋ほかから3つ（紛らわしいもの＝mban は入れない）。ならびは決まった順。
function optsOf(q) {
  if (q.m === 'g' || q.m === 'd') return CKEYS;
  if (q.m === 's' && q.dir === 'r') {
    // 季節→たべもの：正解1つと、ほかの季節が旬の3つ（同じ季節のものは入れない）
    const o = shuffle(FOODS.filter(f => f.s && f.s !== q.f.s && f.id !== q.f.id)).slice(0, 3).map(f => f.id);
    return shuffle([q.f.id, ...o]);
  }
  if (q.m === 's') return SKEYS;
  if (q.m === 'p') return PKEYS;
  if (q.m === 'e') { const o = shuffle(EVENTS.filter(e => e.id !== q.f.id && e.mo !== q.f.mo)).slice(0, 3).map(e => e.id); return shuffle([q.f.id, ...o]); }
  const ban = q.f.mban || [], others = shuffle(BKEYS.filter(k => k !== q.f.m && !ban.includes(k))).slice(0, 3);
  return BKEYS.filter(k => k === q.f.m || others.includes(k));
}

// 主食・主菜・副菜・汁物のうち3つ（むずかしいは2つ）が決まっていて、たりない品を候補から選ぶ
const KN = 5;
let K = null;
const kOf = id => F[id].k;
// こんだて：和・洋・中の「定食」でそろえる。空けるのは主菜と副菜だけ
const stOf = d => (d.st || '').split(',').filter(Boolean);
const kIn = (s, c, kx = false) => DISHES.filter(d => d.k === c && stOf(d).includes(s) && (kx || !d.kx)).map(d => d.id);
function kRedsOk(ids) { const reds = ids.flatMap(id => F[id].ing.filter(i => F[i].g === 'r')); return new Set(reds).size === reds.length; }
// わなの候補を、種類ごとにかわるがわる取り出す
function kMix(groups, n) {
  const gs = groups.map(g => shuffle(g)).filter(g => g.length), out = [];
  while (out.length < n && gs.some(g => g.length)) for (const g of gs) { if (g.length && out.length < n) { const id = g.shift(); if (!out.includes(id)) out.push(id); } }
  return out;
}
function kMakeRound(D, used, type) {
  for (let t = 0; t < 600; t++) {
    const rr = Math.random(), s = rr < .5 ? 'wa' : rr < .8 ? 'yo' : 'chu';
    const menu = {};
    for (const c of KKEYS) menu[c] = sample(kIn(s, c));
    if (Object.values(menu).some(v => !v) || !kRedsOk(Object.values(menu))) continue;
    const sig = s + '|' + KKEYS.map(c => menu[c]).join('|');
    if (used.has(sig)) continue;
    const inMenu = id => Object.values(menu).includes(id);
    const ones = DISHES.filter(d => d.k === 'one' && stOf(d).includes(s)).map(d => d.id);
    const shus = kIn(s, 'shu', true).filter(id => !inMenu(id));
    // コロッケは子どもには「メインのおかず」に見えるので、主菜を考える問題では副菜のわなにしない（d.kmx）
    const more = (c, noMx) => kIn(s, c).filter(id => !inMenu(id) && !(noMx && F[id].kmx));
    const order = D === 'easy' ? [...KKEYS] : shuffle([...KKEYS]);
    if (type === 'swap') {
      const dup = Math.random() < .6 ? 'sai' : 'fuku', lack = dup === 'sai' ? 'fuku' : 'sai';
      if (dup === 'fuku' && F[menu.fuku].kmx) continue;
      const second = more(dup, dup === 'fuku').find(id => kRedsOk([...Object.values(menu), id]));
      if (!second) continue;
      // ならべる4品：主食・同じ種類が2つ・汁物（たりない種類は候補の中に1つだけ）
      const shown = shuffle([menu.shu, menu[dup], second, menu.shiru]);
      const traps = kMix([more(dup, dup === 'fuku').filter(id => id !== second), ones, lack === 'fuku' ? [] : more('shiru')], 3);
      if (traps.length < 2) continue;
      used.add(sig);
      return { type, s, menu, dup, lack, second, shown, cands: shuffle([menu[lack], ...traps]) };
    }
    const miss = D === 'hard' ? ['sai', 'fuku'] : [sample(['sai', 'fuku'])];
    if (miss.includes('sai') && miss.includes('fuku') && F[menu.fuku].kmx) continue;
    const nC = D === 'easy' ? 3 : D === 'normal' ? 4 : 6;
    // 正しい種類は候補に1つだけ。副菜がたりないときは汁物を候補に出さない（食事バランスガイドでは野菜の汁物も副菜に数えるため）
    const groups = [];
    if (!miss.includes('sai')) groups.push(more('sai'));
    if (!miss.includes('fuku')) groups.push(more('fuku', true));
    groups.push(ones);
    if (!miss.includes('fuku')) groups.push(more('shiru'));
    if (D !== 'easy') groups.push(shus);
    const traps = kMix(groups, nC - miss.length);
    if (traps.length < Math.min(2, nC - miss.length)) continue;

    return { type: 'miss', s, menu, miss, order, cands: shuffle([...miss.map(c => menu[c]), ...traps]) };

}

  }
  if (f.kind === 'dish') {
    box.innerHTML = `<button class="x" aria-label="とじる">×</button>${foodSvg(f.id)}<div><div class="nm">${R(f.n)}</div><div class="tg">${R(KZ[f.k].n)}　${f.d.split('').map(gBadge).join(' ')}</div><div class="inglist">${f.ing.map(id => `<span class="ingc sm">${foodSvg(id)}${R(F[id].n)} ${F[id].g ? gBadge(F[id].g) : `<span class="gb out">${R('{色|いろ}に{数|かぞ}えない')}</span>`}</span>`).join('')}</div></div>`;
    box.classList.remove('hidden'); box.querySelector('.x').onclick = () => { zSel = null; renderZukan(); }; return;
  }
  const tg = (f.g ? gBadge(f.g) + ' のなかま' : `<span class="gb out">${R('なかま{分|わ}けには{出|で}ない')}</span>`) + ' ' + (f.s ? 'しゅん ' + sBadge(f.s) : `<span class="gb out">${R('しゅんの{問題|もんだい}には{出|で}ない')}</span>`)
    + (f.m ? ' もと ' + mBadge(f.m) : '') + (f.p ? ` ${pBadge(f.p)} を${R('{食|た}べる')}` : '');
  const ex = [f.g ? `${GROUPS[f.g].n}：${GROUPS[f.g].d}` : '', f.gx, f.gn, f.sx, f.mx, f.px].filter(Boolean).map(t => `<div>${R(t)}</div>`).join('');
  box.innerHTML = `<button class="x" aria-label="とじる">×</button>${foodSvg(f.id)}<div><div class="nm">${R(f.n)}</div><div class="tg">${tg}</div><div class="ex">${ex}</div></div>`;
  box.classList.remove('hidden');
  box.querySelector('.x').onclick = () => { zSel = null; renderZukan(); };
}

/* ---------- sample (絵のみほん) ---------- */
function renderSample() {
  const ids = ['tomato', 'gohan', 'tamago', 'shimeji', 'ebi', 'kaki'];
  const S = [
    ['a', 'A　{線|せん}あり', 'ふちに{茶色|ちゃいろ}の{線|せん}。ぬりえのような、くっきりした{絵|え}。'],
    ['b', 'B　{線|せん}なし', '{線|せん}を{使|つか}わない、{色|いろ}の{形|かたち}だけのやわらかい{絵|え}。'],
    ['c', 'C　{顔|かお}つき', 'A に{目|め}と{口|くち}をつけた、キャラクターふうの{絵|え}。'],
  ];
  $('#smp').innerHTML = S.map(([k, t, d]) => `<div class="smpcol"><h4>${R(t)}</h4><p>${R(d)}</p><div class="gr">${ids.map(id => foodSvg(id, k, '')).join('')}</div></div>`).join('');
}

applyStatic();
renderTitle();
</script>
